# @package _global_
defaults:
  - /global_config
  - /dataset: sportsmot.yaml
  - /inference: val.yaml
  - /eval: default.yaml
  - /object_detection: mmdet_yolox_low_conf_sportsmot.yaml
  - /algorithm: movesort.yaml
  - /postprocess: sportsmot.yaml
  - /path: default.yaml
  - optimize_base
  - /mlflow: default.yaml
  - _self_


experiment: 'sportsmot-movesort-mfgcs-g5r3-n6-s6'

optimizer:
  sampler: mfgcs
  direction: maximize
  study_name: sportsmot_movesort_mfgcs_g5r3_n6_s6
  sampler_params:
    scene_sampler:
      type: random
      params:
        n: 6
        seed: 42
    coordinate_optimizer:
      type: grid
      params:
        grid: 5
        rounds: 3
    max_sweeps: 6
    max_trials: 100
    bootstrap_full_eval: true
    early_stop: true
    accept_threshold: 1.0e-4
    drop_after_barren_sweeps: 2
    shrink:
      enabled: true
      radius_frac: 0.25
      window_size: 3
  search_space:

    algorithm.params.new_tracklet_detection_threshold:
      type: float
      low: 0.1
      high: 0.9
      min_param: algorithm.params.detection_threshold

    # --- Algorithm: Matcher params (Move) ---
    algorithm.params.matcher.params.match_threshold:
      type: float
      low: 0.10
      high: 0.50
    algorithm.params.matcher.params.fuse_score:
      type: categorical
      choices: [true, false]
    algorithm.params.matcher.params.motion_lambda:
      type: float
      low: 1.0
      high: 15.0
      log: true
    algorithm.params.matcher.params.distance_name:
      type: categorical
      choices: [l1, l2]
