# SparseTrack = ByteTrack + DCM
name: sparse
params:
  filter:
    name: bot-sort
    params:
      override_std_weight_position: 0.05
  initialization_threshold: 3
  remember_threshold: 30
  new_tracklet_detection_threshold: 0.7
  detection_threshold: 0.6
  duplicate_iou_threshold: 0.85
  high_matcher:
    name: dcm
    params:
      levels: 12
      match_threshold: 0.3
      fuse_score: false
  low_matcher:
    name: dcm
    params:
      levels: 12
      match_threshold: 0.50
      fuse_score: false
  new_matcher:
    name: iou
    params:
      match_threshold: 0.25
      fuse_score: false