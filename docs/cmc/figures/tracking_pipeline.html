<style>
  :root {
    --ink: #212529;
    --muted: #6c757d;
    --card: #f1f3f5;
    --rule: #ced4da;
  }
  body {
    margin: 0;
    padding: 28px 32px 34px;
    background: #fff;
    color: var(--ink);
    font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
  }
  .diagram { max-width: 1180px; margin: 0 auto; }
  .stages {
    display: grid;
    grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr;
    align-items: stretch;
    gap: 0;
  }
  .stage {
    background: var(--card);
    border-radius: 10px;
    padding: 14px 16px 16px;
    text-align: center;
  }
  .stage-name { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
  .stage-note { margin-top: 5px; font-size: 13.5px; color: var(--muted); }
  .arrow {
    align-self: center;
    width: 34px;
    height: 12px;
    margin: 0 8px;
    background: var(--rule);
    clip-path: polygon(0 34%, 62% 34%, 62% 0, 100% 50%, 62% 100%, 62% 66%, 0 66%);
  }
  /* The glyph row sits under the stages and shows what each one hands on. */
  .glyphs {
    display: grid;
    grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr;
    margin-top: 14px;
  }
  .glyph { display: flex; align-items: center; justify-content: center; gap: 9px; height: 54px; }
  .glyph-gap { width: 50px; }
  .g-det, .g-pred { width: 26px; height: 40px; border: 2.5px solid #000000; }
  .g-pred { border-style: dashed; border-color: #2f9e44; }
  .g-link { width: 26px; height: 2px; background: #f08c00; }
  .frames { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; margin-top: 6px; }
  .frame { margin: 0; }
  .canvas { position: relative; line-height: 0; overflow: hidden; border-radius: 3px; }
  .canvas img { width: 100%; height: auto; border-radius: 3px; }
  .det, .pred { position: absolute; box-sizing: border-box; }
  .det { border: 2.5px solid #000000; }
  .pred { border: 2.5px dashed; z-index: 2; }
  figcaption { margin-top: 9px; text-align: center; font-size: 15px; }
</style>
