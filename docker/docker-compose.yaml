# Check docker/Dockerfile
version: "3.9"

networks:
  motrack-net:
    name: motrack-net

services:
  motrack-env:
    container_name: ${CONT_NAME:-motrack-env}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: motrack-env
    stdin_open: true
    tty: true
    command: bash

    shm_size: 16gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '${GPU}' ]
              capabilities: [ gpu ]
          cpus: '${CPUS:-1.0}'

    volumes:
      - '/tmp:/tmp'
      - '${DATA}:/media/home'
      - '${CODE:-$PWD}:/motrack'

    networks:
      - motrack-net

    environment:
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://motrack-mlflow:5000}

  motrack-mlflow:
    container_name: ${MLFLOW_CONT_NAME:-motrack-mlflow}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: motrack-env
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///media/home/mlflow/mlflow.db
      --default-artifact-root /media/home/mlflow/artifacts
      --allowed-hosts *
    ports:
      - '${MLFLOW_PORT:-5000}:5000'

    volumes:
      - '${DATA}:/media/home'
      - '${CODE:-$PWD}:/motrack'

    networks:
      - motrack-net

  motrack-env-yolox:  # deprecated: back-compatibility
    container_name: ${YOLOX_CONT_NAME:-motrack-env-yolox}
    build:
      context: ..
      dockerfile: docker/yolox.Dockerfile
    image: motrack-env-yolox
    stdin_open: true
    tty: true
    command: bash

    shm_size: 16gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '${GPU}' ]
              capabilities: [ gpu ]
          cpus: '${CPUS:-1.0}'

    volumes:
      - '/tmp:/tmp'
      - '${DATA}:/media/home'
      - '${CODE:-$PWD}:/motrack'

    networks:
      - motrack-net
